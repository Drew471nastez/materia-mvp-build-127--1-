# Every week, the newest off-site backup is restored into a throwaway
# Postgres and every key table's rows are counted against what was backed up.
# A backup that has never been restored is a hope. Runbook: docs/operations/backups.md.
name: Weekly restore drill

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_DEST: s3://${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      DRILL_DB_URL: postgresql://postgres:drill@localhost:5432/drill
    steps:
      - uses: actions/checkout@v4
      - name: Configured?
        id: ready
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "Backups are not configured yet, so there is nothing to restore (docs/operations/backups.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Postgres 17 client
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Restore the newest backup and count its rows
        if: steps.ready.outputs.ok == 'true'
        shell: bash
        run: PG_BIN=/usr/lib/postgresql/17/bin scripts/backup/restore-drill.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tell the owner
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Storelib weekly RESTORE DRILL failed, the newest backup may not restore: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$ALERT_WEBHOOK_URL"
