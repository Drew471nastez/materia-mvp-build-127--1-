# Storelib's nightly off-site backup: the whole database and every uploaded file,
# to storage outside Supabase. Runbook: docs/operations/backups.md.
#
# Until the secrets below are set in GitHub (Settings, Secrets and variables,
# Actions), each job says so in its summary and stops without failing.
name: Nightly backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_DEST: s3://${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - name: Configured?
        id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "Backups are not configured yet: set SUPABASE_DB_URL, BACKUP_PASSPHRASE and the BACKUP_S3_* secrets (docs/operations/backups.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Postgres 17 client
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Back up the database
        if: steps.ready.outputs.ok == 'true'
        run: PG_BIN=/usr/lib/postgresql/17/bin scripts/backup/backup-database.sh
      - name: Tell the owner
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Storelib nightly DATABASE backup failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$ALERT_WEBHOOK_URL"

  files:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Configured?
        id: ready
        run: |
          if [ -z "$SUPABASE_S3_ACCESS_KEY_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "File backups are not configured yet: set the SUPABASE_S3_* and BACKUP_S3_* secrets (docs/operations/backups.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install rclone
        if: steps.ready.outputs.ok == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Mirror every bucket
        if: steps.ready.outputs.ok == 'true'
        run: scripts/backup/backup-storage.sh
      - name: Tell the owner
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Storelib nightly FILE backup failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$ALERT_WEBHOOK_URL"
