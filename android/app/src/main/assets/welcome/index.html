<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Storelib</title>
<style>
/* ── Reset ─────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ── Animated dark gradient background with purple orbs ────────── */
.bg{position:fixed;inset:0;background:#050505;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(120px);
  will-change:transform,opacity;pointer-events:none}
.orb-1{width:420px;height:420px;background:rgba(88,28,135,.18);
  left:-8%;bottom:10%;animation:orbFloat1 20s ease-in-out infinite}
.orb-2{width:340px;height:340px;background:rgba(124,58,237,.12);
  right:-5%;top:5%;animation:orbFloat2 24s ease-in-out infinite}
.orb-3{width:280px;height:280px;background:rgba(109,40,217,.09);
  left:40%;top:30%;animation:orbFloat3 18s ease-in-out infinite}

@keyframes orbFloat1{
  0%,100%{transform:translate(0,0) scale(1);opacity:.5}
  25%{transform:translate(60px,-40px) scale(1.15);opacity:.7}
  50%{transform:translate(-30px,50px) scale(.9);opacity:.6}
  75%{transform:translate(40px,20px) scale(1.1);opacity:.8}}
@keyframes orbFloat2{
  0%,100%{transform:translate(0,0) scale(1);opacity:.4}
  33%{transform:translate(-50px,40px) scale(1.1);opacity:.65}
  66%{transform:translate(30px,-30px) scale(.95);opacity:.5}}
@keyframes orbFloat3{
  0%,100%{transform:translate(0,0) scale(1);opacity:.3}
  50%{transform:translate(40px,-50px) scale(1.2);opacity:.55}}

/* ── Main layout ───────────────────────────────────────────────── */
.container{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;height:100%;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 40px) 20px
          calc(env(safe-area-inset-bottom,0px) + 20px)}

/* ── Logo row ──────────────────────────────────────────────────── */
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;
  flex-shrink:0;
  opacity:0;animation:fadeInDown .7s cubic-bezier(.22,1,.36,1) .1s forwards}
.logo-icon{width:28px;height:28px}
.logo-text{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#fff}

/* ── Collage zone: holds cards + overlay bubble ────────────────── */
.collage-zone{position:relative;flex:1;width:100%;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
  opacity:0;animation:fadeInScale .9s cubic-bezier(.22,1,.36,1) .3s forwards}

.collage-inner{position:relative;width:1100px;height:375px;
  transform-origin:center center}

.collage-card{position:absolute;border-radius:14px;overflow:hidden;
  will-change:transform,opacity;backface-visibility:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.45)}
.collage-card img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Shimmer skeleton ──────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{background:linear-gradient(90deg,#1a1a1a 0%,#262626 25%,#1f1f1f 50%,#262626 75%,#1a1a1a 100%);
  background-size:200% 100%;animation:shimmer 1.8s ease-in-out infinite}

/* ── Typing bubble overlay (centered over the collage) ─────────── */
.bubble-overlay{position:absolute;z-index:10;
  left:50%;top:50%;transform:translate(-50%,-55%);
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
  opacity:0;animation:fadeInDown .7s cubic-bezier(.22,1,.36,1) .5s forwards}

/* Badge pill */
.typing-badge{display:inline-flex;align-items:center;gap:5px;
  background:rgba(243,244,246,.95);color:#555;
  font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08)}
.typing-badge svg{opacity:.6}

/* White bubble card */
.typing-card{background:#fff;border-radius:24px;
  padding:20px 24px;min-width:260px;max-width:88vw;
  text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08)}
.typing-text{font-size:22px;font-weight:700;color:#0a0a0a;line-height:1.35;
  min-height:1.35em;letter-spacing:-.02em}
.cursor{display:inline-block;width:3px;height:.85em;background:#8b5cf6;
  margin-left:2px;border-radius:2px;vertical-align:middle;
  animation:cursorPulse 1s ease-in-out infinite}
@keyframes cursorPulse{0%,100%{opacity:1}50%{opacity:0}}

/* ── Buttons ───────────────────────────────────────────────────── */
.btn-row{display:flex;flex-direction:column;gap:10px;
  width:100%;max-width:340px;padding-bottom:5vh;flex-shrink:0;
  opacity:0;animation:fadeInUp .7s cubic-bezier(.22,1,.36,1) .65s forwards}
.btn{width:100%;padding:16px 0;border-radius:999px;font-size:16px;font-weight:600;
  text-align:center;cursor:pointer;border:none;letter-spacing:-.01em;
  transition:transform .15s ease,opacity .15s ease}
.btn:active{transform:scale(.97);opacity:.85}
.btn-signup{background:#fff;color:#0a0a0a}
.btn-login{background:#161616;color:#fff;border:1px solid rgba(255,255,255,.12)}

/* ── Entry animations ──────────────────────────────────────────── */
@keyframes fadeInDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* ── Mobile-specific overrides (≤480px) ────────────────────────── */
@media(max-width:480px){
  .container{
    padding:calc(env(safe-area-inset-top,0px) + 32px) 16px
            calc(env(safe-area-inset-bottom,0px) + 12px)}
  .logo-row{margin-bottom:14px}
  .logo-icon{width:26px;height:26px}
  .logo-text{font-size:18px}

  .collage-zone{margin-bottom:8px}

  .bubble-overlay{transform:translate(-50%,-52%)}
  .typing-badge{font-size:9px;padding:4px 10px;margin-bottom:6px}
  .typing-card{padding:16px 20px;border-radius:20px;min-width:220px}
  .typing-text{font-size:19px}

  .btn-row{max-width:100%;gap:9px;padding-bottom:3vh}
  .btn{padding:15px 0;font-size:15px}
}

/* ── Tall phones (≥700px height) give collage more room ────────── */
@media(min-height:700px){
  .collage-zone{margin-bottom:12px}
}

/* ── Short phones (≤600px height) compress layout ──────────────── */
@media(max-height:600px){
  .container{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
  .logo-row{margin-bottom:8px}
  .typing-card{padding:14px 18px}
  .typing-text{font-size:17px}
  .btn{padding:13px 0;font-size:14px}
  .btn-row{gap:7px;padding-bottom:2vh}
}
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Content -->
<div class="container">
  <!-- Logo -->
  <div class="logo-row">
    <img class="logo-icon"
         src="https://skgtqglupjcnfhfscink.supabase.co/storage/v1/object/public/platform%20images/5135%20(1).svg"
         alt="Storelib">
    <span class="logo-text">Storelib</span>
  </div>

  <!-- Collage zone: cards + typing bubble overlay -->
  <div class="collage-zone">
    <div class="collage-inner" id="collageInner"></div>

    <!-- Typing bubble overlaid on collage (matches website hero) -->
    <div class="bubble-overlay">
      <div class="typing-badge">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        All-in-one
      </div>
      <div class="typing-card">
        <div class="typing-text"><span id="typingTarget"></span><span class="cursor"></span></div>
      </div>
    </div>
  </div>

  <!-- Auth buttons: Sign up (top), Log in (bottom), stacked full-width -->
  <div class="btn-row">
    <button class="btn btn-signup" id="btnSignup">Sign up</button>
    <button class="btn btn-login"  id="btnLogin">Log in</button>
  </div>
</div>

<script>
/* ─── Typing effect (matches hero.tsx logic exactly) ────────────── */
var PHRASES=[
  "Start monetizing your passion...",
  "Build link in bio pages...",
  "Sell digital products...",
  "Share your passion...",
  "Build your online store..."
];
var TYPING_SPEED=70,DELETING_SPEED=35,PAUSE_MS=2000;

(function(){
  var el=document.getElementById("typingTarget"),pi=0,ci=0,del=false;
  function tick(){
    var p=PHRASES[pi];
    if(!del){ci++;el.textContent=p.substring(0,ci);
      if(ci===p.length){del=true;setTimeout(tick,PAUSE_MS);return}
      setTimeout(tick,TYPING_SPEED)}
    else{ci--;el.textContent=p.substring(0,ci);
      if(ci===0){del=false;pi=(pi+1)%PHRASES.length;setTimeout(tick,300);return}
      setTimeout(tick,DELETING_SPEED)}
  }
  setTimeout(tick,600);
})();

/* ─── Collage (ported from hero.tsx) ────────────────────────────── */
var BASE="https://skgtqglupjcnfhfscink.supabase.co/storage/v1/render/image/public/platform%20images/collage%20imags";
var IMAGES=[
  "Monetize%20(5)%20(2).webp","Monetize%20(6)%20(1).webp",
  "Monetize%20(7)%20(1).webp","Monetize%20(21).webp","Monetize%20(9).webp"
];

/* Mobile card slots from hero.tsx MOBILE_CARDS */
var SLOTS=[
  {left:38, top:50,width:180,height:225,zIndex:1,opacity:0,   scale:.95},
  {left:205,top:25,width:220,height:275,zIndex:2,opacity:.85, scale:.98},
  {left:415,top:0, width:260,height:325,zIndex:3,opacity:1,   scale:1},
  {left:665,top:25,width:220,height:275,zIndex:2,opacity:.85, scale:.98},
  {left:872,top:50,width:180,height:225,zIndex:1,opacity:0,   scale:.95}
];
var CANVAS_W=1100,CANVAS_H=375,TRANSITION_MS=1500,AUTOPLAY_MS=3800;

var order=[0,1,2,3,4],animating=false;
var root=document.getElementById("collageInner"),cardEls=[];

/* Scale collage to viewport — matches hero.tsx mobile scale(0.96) */
function scaleCollage(){
  var vw=window.innerWidth;
  var vh=window.innerHeight*0.48;
  var s=Math.min((vw+60)/CANVAS_W,vh/CANVAS_H,1.1);
  /* Apply the hero.tsx mobile base scale on top */
  s=s*0.96;
  root.style.transform="scale("+s+")";
}
scaleCollage();
window.addEventListener("resize",scaleCollage);

/* Create card DOM */
for(var i=0;i<5;i++){
  var d=document.createElement("div");d.className="collage-card shimmer";
  var img=document.createElement("img");
  img.src=BASE+"/"+IMAGES[i]+"?width=280&height=350&resize=cover&quality=55";
  img.alt="";img.loading=(i>=1&&i<=3)?"eager":"lazy";
  img.onload=(function(el){return function(){el.classList.remove("shimmer")}})(d);
  d.appendChild(img);root.appendChild(d);cardEls.push(d);
}

/* Position helpers */
function applySlot(el,s){
  el.style.cssText="position:absolute;border-radius:14px;overflow:hidden;"+
    "left:"+s.left+"px;top:"+s.top+"px;width:"+s.width+"px;height:"+s.height+"px;"+
    "opacity:"+s.opacity+";z-index:"+s.zIndex+";transform:scale("+s.scale+");"+
    "box-shadow:0 8px 32px rgba(0,0,0,.45)";
}
function lerp(a,b,t){return a+(b-a)*t}
function interpCards(fromOrd,toOrd,p){
  for(var i=0;i<5;i++){
    var ci=fromOrd[i],el=cardEls[ci];
    var fi=fromOrd.indexOf(ci),ti=toOrd.indexOf(ci);
    var a=SLOTS[fi],b=SLOTS[ti];
    el.style.cssText="position:absolute;border-radius:14px;overflow:hidden;"+
      "left:"+lerp(a.left,b.left,p)+"px;top:"+lerp(a.top,b.top,p)+"px;"+
      "width:"+lerp(a.width,b.width,p)+"px;height:"+lerp(a.height,b.height,p)+"px;"+
      "opacity:"+lerp(a.opacity,b.opacity,p)+";"+
      "z-index:"+Math.round(lerp(a.zIndex,b.zIndex,p))+";"+
      "transform:scale("+lerp(a.scale,b.scale,p)+");"+
      "box-shadow:0 8px 32px rgba(0,0,0,.45)";
  }
}

/* Initial position */
for(var j=0;j<5;j++) applySlot(cardEls[order[j]],SLOTS[j]);

/* Rotate order (last → first) */
function rotateOrder(arr){return [arr[arr.length-1]].concat(arr.slice(0,arr.length-1))}

/* Quartic ease-in-out (matches hero.tsx) */
function ease(t){return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2}

/* Animate one rotation */
function startRotation(){
  if(animating)return;animating=true;
  var from=order.slice(),to=rotateOrder(order),start=performance.now();
  function tick(now){
    var raw=Math.min(1,(now-start)/TRANSITION_MS);
    interpCards(from,to,ease(raw));
    if(raw<1) requestAnimationFrame(tick);
    else{order=to;animating=false}
  }
  requestAnimationFrame(tick);
}
setInterval(startRotation,AUTOPLAY_MS);

/* Touch swipe on collage */
var touchX=0;
root.addEventListener("touchstart",function(e){touchX=e.touches[0].clientX},{passive:true});
root.addEventListener("touchend",function(e){
  if(Math.abs(e.changedTouches[0].clientX-touchX)>40) startRotation();
},{passive:true});

/* ─── Button handlers (call into Android native bridge) ─────────── */
document.getElementById("btnSignup").addEventListener("click",function(){
  if(window.Android) Android.onSignUp(); else location.href="https://storelib.com/signup";
});
document.getElementById("btnLogin").addEventListener("click",function(){
  if(window.Android) Android.onLogIn(); else location.href="https://storelib.com/login";
});
</script>
</body>
</html>
