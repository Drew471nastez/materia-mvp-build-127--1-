<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Storelib</title>
<style>
/* ── Reset ─────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#F3F4F6;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#171717;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none
}

/* ── Root flex column ───────────────────────────────────────────── */
.root{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  overflow:hidden;
  background:#F3F4F6
}

/* ── Logo ──────────────────────────────────────────────────────── */
.logo-row{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 1.25rem);
  padding-bottom:0.75rem
}
.logo-icon{width:39px;height:39px;display:block}
.logo-text{
  font-size:clamp(19px,5.5vw,26px);
  font-weight:700;letter-spacing:-.02em;color:#171717
}

/* ── Collage zone ──────────────────────────────────────────────── */
.collage-zone{
  flex:1;min-height:0;
  position:relative;overflow:hidden
}
/* Canvas: 1100×375, centered via JS transform */
.collage-inner{
  position:absolute;
  width:1100px;height:375px;
  left:50%;top:50%;
  transform-origin:center center
  /* JS sets: transform: translate(-50%, -46%) scale(s) */
}
.collage-card{
  position:absolute;border-radius:14px;overflow:hidden;
  will-change:transform,opacity;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.10)
}
.collage-card img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:opacity .7s ease
}
.collage-card img.hidden-img{opacity:0}

/* Shimmer */
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
.shimmer{
  position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(90deg,#e0e0e0 0%,#ebebeb 25%,#e3e3e3 50%,#ebebeb 75%,#e0e0e0 100%);
  background-size:200% 100%;
  animation:shimmer 1.8s ease-in-out infinite;
  transition:opacity .8s ease
}

/* ── Typing text ───────────────────────────────────────────────── */
.typing-row{
  flex-shrink:0;
  padding:4px 16px;
  display:flex;align-items:center;justify-content:center
}
.typing-text{
  font-size:clamp(21px,5vw,28px);
  font-weight:700;color:#171717;
  text-align:center;line-height:1.25;
  min-height:2em;
  display:flex;align-items:center;justify-content:center
}
.cursor{
  display:inline-block;width:3px;height:.85em;
  background:#8b5cf6;margin-left:2px;
  border-radius:2px;vertical-align:middle
}
@keyframes cursorPulse{0%,100%{opacity:1}50%{opacity:.5}}
.cursor{animation:cursorPulse 2s cubic-bezier(.4,0,.6,1) infinite}

/* ── Buttons ───────────────────────────────────────────────────── */
.btn-row{
  flex-shrink:0;
  padding:0 16px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 5px);
  display:flex;flex-direction:column;gap:12px
}
.btn{
  width:100%;border:none;outline:none;cursor:pointer;
  height:clamp(50px,7vh,58px);
  font-size:clamp(15px,4.5vw,17px);font-weight:600;
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:opacity .15s ease;
  -webkit-appearance:none
}
.btn:active{opacity:.8}
.btn-signup{background:#7c3aed;color:#fff}
.btn-login{background:#171717;color:#fff}
.btn:disabled{cursor:not-allowed}
.btn-other-dim{opacity:.5}

/* Spinner inside button */
@keyframes btn-spin{to{transform:rotate(360deg)}}
.btn-spinner{
  display:inline-block;
  width:20px;height:20px;
  border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:btn-spin .7s linear infinite;
  flex-shrink:0
}

/* Full-screen nav overlay — #F3F4F6 matches MainActivity exactly */
.nav-overlay{
  position:fixed;inset:0;z-index:9999;
  background:#F3F4F6;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .18s ease
}
.nav-overlay.visible{opacity:1;pointer-events:all}
@keyframes nav-spin{to{transform:rotate(360deg)}}
.nav-spinner{
  width:36px;height:36px;
  border:3px solid rgba(124,58,237,.2);
  border-top-color:#7c3aed;
  border-radius:50%;
  animation:nav-spin .75s linear infinite
}
</style>
</head>
<body>

<!-- Nav overlay: shows while Android opens MainActivity, exact same #F3F4F6 color -->
<div class="nav-overlay" id="navOverlay">
  <span class="nav-spinner"></span>
</div>

<div class="root">

  <!-- Logo -->
  <div class="logo-row">
    <img class="logo-icon"
         src="https://skgtqglupjcnfhfscink.supabase.co/storage/v1/object/public/platform%20images/5135%20(1).svg"
         alt="Storelib">
    <span class="logo-text">Storelib</span>
  </div>

  <!-- Collage: canvas is centered vertically within this flex-1 zone -->
  <div class="collage-zone">
    <div class="collage-inner" id="collageInner"></div>
  </div>

  <!-- Typing text -->
  <div class="typing-row">
    <p class="typing-text">
      <span id="typingTarget"></span><span class="cursor"></span>
    </p>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-signup" id="btnSignup">Sign up</button>
    <button class="btn btn-login"  id="btnLogin">Log in</button>
  </div>

</div>

<script>
/* ─── Typing effect ───────────────────────────────────────────── */
var PHRASES=[
  "Start monetizing your passion...",
  "Build link in bio pages...",
  "Sell digital products...",
  "Share your passion...",
  "Build your online store..."
];
(function(){
  var el=document.getElementById("typingTarget");
  var pi=0,ci=0,del=false;
  function tick(){
    var p=PHRASES[pi];
    if(!del){
      ci++;el.textContent=p.substring(0,ci);
      if(ci===p.length){del=true;setTimeout(tick,2000);return}
      setTimeout(tick,70);
    } else {
      ci--;el.textContent=p.substring(0,ci);
      if(ci===0){del=false;pi=(pi+1)%PHRASES.length;setTimeout(tick,300);return}
      setTimeout(tick,35);
    }
  }
  setTimeout(tick,600);
})();

/* ─── Collage ─────────────────────────────────────────────────── */
var BASE="https://skgtqglupjcnfhfscink.supabase.co/storage/v1/render/image/public/platform%20images/collage%20imags";
var IMG_NAMES=["Monetize%20(5)%20(2).webp","Monetize%20(6)%20(1).webp",
  "Monetize%20(7)%20(1).webp","Monetize%20(21).webp","Monetize%20(9).webp"];

var SLOTS=[
  {left:38, top:50,width:180,height:225,zIndex:1,opacity:0,   scale:.95},
  {left:205,top:25,width:220,height:275,zIndex:2,opacity:.85, scale:.98},
  {left:415,top:0, width:260,height:325,zIndex:3,opacity:1,   scale:1  },
  {left:665,top:25,width:220,height:275,zIndex:2,opacity:.85, scale:.98},
  {left:872,top:50,width:180,height:225,zIndex:1,opacity:0,   scale:.95}
];
var CANVAS_W=1100,CANVAS_H=375,TRANSITION_MS=1500,AUTOPLAY_MS=3800;

var root=document.getElementById("collageInner");
var cardEls=[];

/* Scale collage to fit zone + center vertically with slight downward nudge */
function scaleCollage(){
  var zone=root.parentElement;
  var h=zone.offsetHeight;
  var s=Math.min((h/CANVAS_H)*0.73, 0.86);
  /* translate(-50%, -46%): centered but ~15px below true center */
  root.style.transform="translate(-50%, -46%) scale("+s+")";
}
scaleCollage();
window.addEventListener("resize",scaleCollage);

/* Build card DOM */
for(var i=0;i<5;i++){
  var wrap=document.createElement("div");
  wrap.className="collage-card";
  var shim=document.createElement("div");
  shim.className="shimmer";
  var img=document.createElement("img");
  img.className="hidden-img";
  img.src=BASE+"/"+IMG_NAMES[i]+"?width=280&height=350&resize=cover&quality=55";
  img.alt="";
  img.loading=(i>=1&&i<=3)?"eager":"lazy";
  (function(sh,im){
    im.onload=function(){im.classList.remove("hidden-img");sh.style.opacity="0"};
    im.onerror=function(){sh.style.opacity="0"};
  })(shim,img);
  wrap.appendChild(shim);
  wrap.appendChild(img);
  root.appendChild(wrap);
  cardEls.push(wrap);
}

function applySlot(el,s){
  el.style.cssText="position:absolute;border-radius:14px;overflow:hidden;"+
    "left:"+s.left+"px;top:"+s.top+"px;width:"+s.width+"px;height:"+s.height+"px;"+
    "opacity:"+s.opacity+";z-index:"+s.zIndex+";"+
    "transform:scale("+s.scale+");box-shadow:0 2px 8px rgba(0,0,0,.10)";
}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2}

var order=[0,1,2,3,4];
for(var j=0;j<5;j++) applySlot(cardEls[order[j]],SLOTS[j]);

function rotateOrder(arr){var n=arr.slice();n.push(n.shift());return n}

var animating=false;
function startRotation(){
  if(animating)return;animating=true;
  var from=order.slice(),to=rotateOrder(order),start=performance.now();
  function tick(now){
    var raw=Math.min(1,(now-start)/TRANSITION_MS);
    var p=ease(raw);
    for(var i=0;i<5;i++){
      var ci=from[i],el=cardEls[ci];
      var fi=from.indexOf(ci),ti=to.indexOf(ci);
      var a=SLOTS[fi],b=SLOTS[ti];
      el.style.cssText="position:absolute;border-radius:14px;overflow:hidden;"+
        "left:"+lerp(a.left,b.left,p)+"px;top:"+lerp(a.top,b.top,p)+"px;"+
        "width:"+lerp(a.width,b.width,p)+"px;height:"+lerp(a.height,b.height,p)+"px;"+
        "opacity:"+lerp(a.opacity,b.opacity,p)+";"+
        "z-index:"+Math.round(lerp(a.zIndex,b.zIndex,p))+";"+
        "transform:scale("+lerp(a.scale,b.scale,p)+");"+
        "box-shadow:0 2px 8px rgba(0,0,0,.10)";
    }
    if(raw<1) requestAnimationFrame(tick);
    else{order=to;animating=false}
  }
  requestAnimationFrame(tick);
}
setInterval(startRotation,AUTOPLAY_MS);

/* ─── Button loading + Android bridge ───────────────────────────── */
var loading=false;
var overlay=document.getElementById("navOverlay");
var btnS=document.getElementById("btnSignup");
var btnL=document.getElementById("btnLogin");

function showSpinner(activeBtn,otherBtn){
  if(loading)return false;
  loading=true;
  activeBtn.innerHTML='<span class="btn-spinner"></span>';
  activeBtn.disabled=true;
  otherBtn.disabled=true;
  otherBtn.classList.add("btn-other-dim");
  /* Show overlay — #F3F4F6 matches MainActivity exactly, zero visible flash */
  overlay.classList.add("visible");
  return true;
}

/* 220ms delay: overlay transition (180ms) + buffer = fully opaque before bridge call */
btnS.addEventListener("click",function(){
  if(!showSpinner(btnS,btnL))return;
  setTimeout(function(){
    if(window.Android) Android.onSignUp();
    else location.href="https://storelib.com/signup";
  },220);
});

btnL.addEventListener("click",function(){
  if(!showSpinner(btnL,btnS))return;
  setTimeout(function(){
    if(window.Android) Android.onLogIn();
    else location.href="https://storelib.com/login";
  },220);
});
</script>
</body>
</html>
