<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="light-content">
    <meta name="theme-color" content="#f2f2f2">
    <meta name="format-detection" content="telephone=no">
    <title>Storelib</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{
          width:100%;height:100%;
          background:#f2f2f2;
          overflow:hidden;
          -webkit-text-size-adjust:100%;
          -webkit-tap-highlight-color:transparent;
        }
        body{
          width:100%;
          height:100%;
          height:100dvh;
          height:-webkit-fill-available;
          overflow:hidden;
          background:#f2f2f2;
          font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
          color:#0a0a0a;
          -webkit-font-smoothing:antialiased;
          -moz-osx-font-smoothing:grayscale;
          position:fixed;
          top:0;left:0;right:0;bottom:0;
        }
        /* Full-bleed background — covers notch, home indicator, everything */
        html::before{
          content:'';
          position:fixed;
          top:-100px;left:-10px;right:-10px;bottom:-100px;
          background:#f2f2f2;
          z-index:-1;
          pointer-events:none;
        }
        .page{
          position:fixed;
          top:0;left:0;right:0;bottom:0;
          width:100%;height:100%;
          overflow:hidden;
          background:#f2f2f2;
          z-index:1;
          padding-top:env(safe-area-inset-top,0px);
          padding-bottom:env(safe-area-inset-bottom,0px);
          padding-left:env(safe-area-inset-left,0px);
          padding-right:env(safe-area-inset-right,0px);
          display:flex;
          flex-direction:column;
          align-items:center;
        }
        /* ── Logo ── */
        .logo-row{
          display:flex;align-items:center;justify-content:center;
          gap:11px;
          padding-top:clamp(18px,4vh,40px);
          flex-shrink:0;
          opacity:0;
          transform:translateY(-14px);
          animation:fadeInDown .65s cubic-bezier(.22,1,.36,1) .1s forwards;
          will-change:transform,opacity;
        }
        .logo-icon{width:34px;height:34px;display:block;object-fit:cover;border-radius:7px;box-shadow:0 0 0 .5px rgba(15,23,42,.06),0 1px 1.5px rgba(15,23,42,.05)}
        .logo-text{font-size:23px;font-weight:700;letter-spacing:-.03em;color:#0a0a0a}
        /* ── Collage ── */
        .collage-area{
          flex:1 1 0%;
          width:100%;
          position:relative;
          overflow:hidden;
          min-height:0;
          margin-top:clamp(12px,2.5vh,24px);
          opacity:0;
          transform:scale(.96);
          animation:fadeInScale .85s cubic-bezier(.22,1,.36,1) .28s forwards;
          will-change:transform,opacity;
        }
        .collage-inner{position:relative;width:100%;height:100%}
        .collage-card{
          position:absolute;top:0;left:0;
          border-radius:18px;overflow:hidden;
          will-change:transform,opacity;
          -webkit-backface-visibility:hidden;
          backface-visibility:hidden;
          transform:translateZ(0);
          box-shadow:0 8px 32px rgba(0,0,0,.12);
        }
        .collage-card img{width:100%;height:100%;object-fit:cover;display:block}
        .collage-area::before,.collage-area::after{
          content:'';position:absolute;top:0;bottom:0;
          width:clamp(24px,7vw,56px);z-index:8;pointer-events:none;
        }
        .collage-area::before{left:0;background:linear-gradient(to right,#f2f2f2 0%,transparent 100%)}
        .collage-area::after{right:0;background:linear-gradient(to left,#f2f2f2 0%,transparent 100%)}
        /* Shimmer placeholder */
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        .shimmer{
          background:linear-gradient(90deg,#e8e8e8 0%,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%,#e8e8e8 100%);
          background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite;
        }
        /* ── Typing ── */
        .typing-area{
          flex-shrink:0;
          text-align:center;
          padding:clamp(14px,3vh,24px) 24px clamp(8px,1.5vh,14px);
          opacity:0;
          transform:translateY(14px);
          animation:fadeInUp .65s cubic-bezier(.22,1,.36,1) .48s forwards;
          will-change:transform,opacity;
        }
        .typing-text{
          font-size:clamp(19px,6vw,30px);
          font-weight:700;color:#0a0a0a;
          line-height:1.3;
          white-space:nowrap;
          overflow:hidden;
        }
        .cursor{
          display:inline-block;width:2.5px;height:.82em;
          background:#7c3aed;
          margin-left:2px;border-radius:2px;vertical-align:middle;
          animation:cursorPulse 1s ease-in-out infinite;
        }
        @keyframes cursorPulse{0%,100%{opacity:1}50%{opacity:0}}
        /* ── Buttons ── */
        .btn-area{
          flex-shrink:0;
          width:100%;
          padding:0 20px clamp(8px,2vh,16px);
          display:flex;flex-direction:column;align-items:center;
          opacity:0;
          transform:translateY(14px);
          animation:fadeInUp .65s cubic-bezier(.22,1,.36,1) .58s forwards;
          will-change:transform,opacity;
        }
        .btn-wrap{width:100%;max-width:400px}
        .btn{
          display:block;width:100%;
          border-radius:10px;
          font-size:16px;font-weight:600;
          text-align:center;
          cursor:pointer;border:none;
          letter-spacing:-.01em;
          -webkit-appearance:none;appearance:none;
          transition:transform .12s ease,opacity .12s ease;
          -webkit-touch-callout:none;
          user-select:none;-webkit-user-select:none;
        }
        .btn:active{transform:scale(.97);opacity:.85}
        .btn-signup{background:#7c3aed;color:#fff;padding:15px 0;margin-bottom:10px}
        .btn-login{background:#0a0a0a;color:rgba(255,255,255,.9);padding:14px 0}
        /* ── Nav overlay — exact match with MainActivity background ── */
        .nav-overlay{
          position:fixed;inset:0;z-index:9999;
          background:#f2f2f2;
          display:flex;align-items:center;justify-content:center;
          opacity:0;pointer-events:none;
          transition:opacity .18s ease;
        }
        .nav-overlay.visible{opacity:1;pointer-events:all}
        @keyframes nav-spin{to{transform:rotate(360deg)}}
        .nav-spinner{
          width:36px;height:36px;
          border:3px solid rgba(124,58,237,.2);
          border-top-color:#7c3aed;
          border-radius:50%;
          animation:nav-spin .75s linear infinite;
        }
        /* ── Landscape ── */
        @media (orientation:landscape) and (max-height:500px){
          .logo-row{padding-top:8px;gap:8px}
          .logo-icon{width:24px;height:24px}
          .logo-text{font-size:17px}
          .collage-area{margin-top:6px}
          .typing-area{padding:8px 20px 4px}
          .typing-text{font-size:clamp(16px,4vw,22px)}
          .btn-area{padding:0 20px 4px}
          .btn-signup,.btn-login{padding:10px 0}
          .btn-signup{margin-bottom:6px}
        }
        /* ── Tablet ── */
        @media (min-width:768px){
          .btn-wrap{max-width:440px}
          .typing-text{font-size:30px}
        }
        /* ── Very short portrait ── */
        @media (max-height:600px) and (orientation:portrait){
          .logo-row{padding-top:12px}
          .collage-area{margin-top:8px}
          .typing-area{padding:10px 20px 6px}
          .btn-area{padding:0 20px 6px}
          .btn-signup,.btn-login{padding:12px 0}
        }
        /* ── Tall phones ── */
        @media (min-height:800px) and (orientation:portrait){
          .logo-row{padding-top:clamp(28px,5vh,48px)}
          .collage-area{margin-top:clamp(16px,3vh,28px)}
          .typing-area{padding:clamp(18px,3.5vh,28px) 24px clamp(10px,2vh,18px)}
        }
        /* ── Reduced motion ── */
        @media (prefers-reduced-motion:reduce){
          *,*::before,*::after{
            animation-duration:0.01ms !important;
            animation-iteration-count:1 !important;
            transition-duration:0.01ms !important;
          }
        }
        @keyframes fadeInDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInScale{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    </style>
</head>
<body>

<div class="nav-overlay" id="navOverlay">
  <span class="nav-spinner"></span>
</div>

<div class="page">
    <div class="logo-row">
        <img class="logo-icon" src="storelib-logo.webp" alt="Storelib logo" width="34" height="34" loading="eager" decoding="async">
        <span class="logo-text">Storelib</span>
    </div>
    <div class="collage-area">
        <div class="collage-inner" id="collageInner"></div>
    </div>
    <div class="typing-area">
        <div class="typing-text"><span id="typingTarget"></span><span class="cursor"></span></div>
    </div>
    <div class="btn-area">
        <div class="btn-wrap">
            <button class="btn btn-signup" id="btnSignup">Sign up</button>
            <button class="btn btn-login" id="btnLogin">Log in</button>
        </div>
    </div>
</div>

<script>
/* ── Typing ── */
var PHRASES = [
    "Start monetizing your passion...",
    "Build link in bio pages...",
    "Sell digital products...",
    "Share your passion...",
    "Build your online store..."
];
var TYPING_SPEED = 70, DELETING_SPEED = 35, PAUSE_MS = 2000;
(function () {
    var el = document.getElementById("typingTarget"), pi = 0, ci = 0, del = false;
    function tick() {
        var p = PHRASES[pi];
        if (!del) {
            ci++;
            el.textContent = p.substring(0, ci);
            if (ci === p.length) { del = true; setTimeout(tick, PAUSE_MS); return; }
            setTimeout(tick, TYPING_SPEED);
        } else {
            ci--;
            el.textContent = p.substring(0, ci);
            if (ci === 0) { del = false; pi = (pi + 1) % PHRASES.length; setTimeout(tick, 300); return; }
            setTimeout(tick, DELETING_SPEED);
        }
    }
    setTimeout(tick, 600);
})();

/* ── Collage ── */
var BASE = "https://skgtqglupjcnfhfscink.supabase.co/storage/v1/render/image/public/platform%20images/collage%20imags";
var IMAGES = [
    "Monetize%20(5)%20(2).webp", "Monetize%20(6)%20(1).webp",
    "Monetize%20(7)%20(1).webp", "Monetize%20(21).webp", "Monetize%20(9).webp"
];
var root = document.getElementById("collageInner"), cardEls = [];
var order = [0, 1, 2, 3, 4], animating = false;
var TRANSITION_MS = 2000, AUTOPLAY_MS = 3800;
var cachedSlots = null, cVW = 0, cVH = 0;
function getSlots() {
    var vw = window.innerWidth;
    var vh = root.offsetHeight;
    if (!vh) vh = Math.min(window.innerHeight * 0.48, window.innerHeight - 200);
    if (cachedSlots && cVW === vw && cVH === vh) return cachedSlots;
    cVW = vw; cVH = vh;
    var cx = vw / 2, cy = vh * 0.5;
    var cw = Math.min(vw * 0.54, vw >= 768 ? 320 : 250);
    var ch = Math.min(cw * 1.38, vh * 0.92);
    cw = ch / 1.38;
    var sw = cw * 0.76, sh = sw * 1.38;
    var fw = cw * 0.6, fh = fw * 1.38;
    var gap = cw * 0.02;
    cachedSlots = [
        { x: -fw * 0.3,                    y: cy, w: fw, h: fh, z: 1, o: 0,   s: .85 },
        { x: cx - cw / 2 - gap - sw / 2,   y: cy, w: sw, h: sh, z: 3, o: .9,  s: 1   },
        { x: cx,                            y: cy, w: cw, h: ch, z: 5, o: 1,   s: 1   },
        { x: cx + cw / 2 + gap + sw / 2,   y: cy, w: sw, h: sh, z: 3, o: .9,  s: 1   },
        { x: vw + fw * 0.3,                y: cy, w: fw, h: fh, z: 1, o: 0,   s: .85 }
    ];
    return cachedSlots;
}
var dpr = Math.min(window.devicePixelRatio || 1, 2);
var imgW = Math.round(280 * dpr), imgH = Math.round(386 * dpr), imgQ = dpr > 1.5 ? 55 : 65;
for (var i = 0; i < 5; i++) {
    var d = document.createElement("div");
    d.className = "collage-card shimmer";
    var img = document.createElement("img");
    img.src = BASE + "/" + IMAGES[i] + "?width=" + imgW + "&height=" + imgH + "&resize=cover&quality=" + imgQ;
    img.alt = ""; img.loading = (i >= 1 && i <= 3) ? "eager" : "lazy";
    img.decoding = "async";
    img.setAttribute("width", imgW); img.setAttribute("height", imgH);
    img.onload = (function (el) { return function () { el.classList.remove("shimmer"); }; })(d);
    d.appendChild(img); root.appendChild(d); cardEls.push(d);
}
function setCard(el, x, y, w, h, o, z, s) {
    el.style.cssText =
        "position:absolute;top:0;left:0;border-radius:18px;overflow:hidden;" +
        "will-change:transform,opacity;-webkit-backface-visibility:hidden;backface-visibility:hidden;" +
        "box-shadow:0 8px 32px rgba(0,0,0,.12);" +
        "transform:translate3d(" + (x - w / 2) + "px," + (y - h / 2) + "px,0) scale(" + s + ");" +
        "opacity:" + o + ";z-index:" + z + ";width:" + w + "px;height:" + h + "px;";
}
function layoutCards() {
    cachedSlots = null;
    var slots = getSlots();
    for (var j = 0; j < 5; j++) {
        var s = slots[j];
        setCard(cardEls[order[j]], s.x, s.y, s.w, s.h, s.o, s.z, s.s);
    }
}
requestAnimationFrame(function () { requestAnimationFrame(layoutCards); });
var resizeT;
window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (!animating) layoutCards(); }, 120);
}, { passive: true });
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) {
    if (t <= 0) return 0; if (t >= 1) return 1;
    return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
}
function interpCards(fromOrd, toOrd, p) {
    var slots = getSlots();
    for (var i = 0; i < 5; i++) {
        var ci = fromOrd[i], el = cardEls[ci];
        var fi = fromOrd.indexOf(ci), ti = toOrd.indexOf(ci);
        var a = slots[fi], b = slots[ti];
        var z = b.z > a.z ? (p > 0.3 ? b.z : a.z) : (b.z < a.z ? (p > 0.7 ? b.z : a.z) : a.z);
        var w = lerp(a.w, b.w, p), h = lerp(a.h, b.h, p);
        var x = lerp(a.x, b.x, p), y = lerp(a.y, b.y, p);
        var s = lerp(a.s, b.s, p);
        var op;
        if (a.o === 0 && b.o > 0) { var fp = Math.min(1, p * 1.8); op = b.o * fp * fp; }
        else if (b.o === 0 && a.o > 0) { var fp2 = Math.max(0, (p - 0.4) / 0.6); op = a.o * (1 - fp2 * fp2); }
        else op = lerp(a.o, b.o, p);
        setCard(el, x, y, w, h, Math.max(0, Math.min(1, op)), z, s);
    }
}
function rotateOrder(arr) { return [arr[arr.length - 1]].concat(arr.slice(0, arr.length - 1)); }
var prefR = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function startRotation() {
    if (animating || prefR) return;
    animating = true;
    var from = order.slice(), to = rotateOrder(order), start = 0;
    function tick(now) {
        if (!start) start = now;
        var raw = Math.min(1, (now - start) / TRANSITION_MS);
        interpCards(from, to, ease(raw));
        if (raw < 1) requestAnimationFrame(tick);
        else { order = to; animating = false; }
    }
    requestAnimationFrame(tick);
}
setInterval(startRotation, AUTOPLAY_MS);
/* Touch swipe */
var touchX = 0;
root.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
root.addEventListener("touchend", function (e) {
    if (Math.abs(e.changedTouches[0].clientX - touchX) > 40) startRotation();
}, { passive: true });

/* ── Buttons + nav overlay ── */
var loading = false;
var overlay = document.getElementById("navOverlay");
var btnS = document.getElementById("btnSignup");
var btnL = document.getElementById("btnLogin");

function showOverlay(activeBtn, otherBtn) {
    if (loading) return false;
    loading = true;
    activeBtn.textContent = "";
    var sp = document.createElement("span");
    sp.style.cssText = "display:inline-block;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:nav-spin .7s linear infinite;";
    activeBtn.appendChild(sp);
    activeBtn.disabled = true;
    otherBtn.disabled = true;
    otherBtn.style.opacity = ".5";
    overlay.classList.add("visible");
    return true;
}

/* 220ms: overlay transition (180ms) + buffer before bridge call */
btnS.addEventListener("click", function () {
    if (!showOverlay(btnS, btnL)) return;
    setTimeout(function () {
        if (window.Android) Android.onSignUp();
        else location.href = "https://storelib.com/signup";
    }, 220);
});
btnL.addEventListener("click", function () {
    if (!showOverlay(btnL, btnS)) return;
    setTimeout(function () {
        if (window.Android) Android.onLogIn();
        else location.href = "https://storelib.com/login";
    }, 220);
});
</script>
</body>
</html>
